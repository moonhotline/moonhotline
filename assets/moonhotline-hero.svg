<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2400 980" width="2400" height="980" role="img" aria-labelledby="title desc">
  <title id="title">Moonhotline - Build. Ship. Learn. Evolve.</title>
  <desc id="desc">A premium midnight-blue visual identity for an AI builder and founder, showing a luminous continuous feedback orbit, an OODA and RSI mindset, and real shipped AI-native projects.</desc>
  <defs>
    <radialGradient id="backdrop" cx="79%" cy="45%" r="81%">
      <stop offset="0" stop-color="#14224b"/>
      <stop offset="0.38" stop-color="#0c142b"/>
      <stop offset="0.73" stop-color="#070d1b"/>
      <stop offset="1" stop-color="#060a12"/>
    </radialGradient>
    <radialGradient id="cyanAura"><stop offset="0" stop-color="#52d8fb" stop-opacity=".40"/><stop offset=".48" stop-color="#546ad9" stop-opacity=".12"/><stop offset="1" stop-color="#0c1323" stop-opacity="0"/></radialGradient>
    <radialGradient id="violetAura"><stop offset="0" stop-color="#9f87ff" stop-opacity=".27"/><stop offset="1" stop-color="#9f87ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1=".1" x2="1" y2=".8" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset=".47" stop-color="#b6d3ff"/>
      <stop offset=".82" stop-color="#79e6f7"/>
      <stop offset="1" stop-color="#b5b0ff"/>
    </linearGradient>
    <linearGradient id="arcA" x1="1550" y1="190" x2="2120" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a1acff" stop-opacity="0"/>
      <stop offset=".21" stop-color="#809bff" stop-opacity=".82"/>
      <stop offset=".45" stop-color="#58ddf9"/>
      <stop offset=".74" stop-color="#b0acff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#e6f8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arcB" x1="2170" y1="225" x2="1500" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b4afff" stop-opacity="0"/>
      <stop offset=".18" stop-color="#c3b1ff"/>
      <stop offset=".44" stop-color="#7b9afa" stop-opacity=".9"/>
      <stop offset=".72" stop-color="#5debff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#53e5ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#80a9d2" stop-opacity=".25"/><stop offset="1" stop-color="#80a9d2" stop-opacity=".07"/></linearGradient>
    <linearGradient id="nodeGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#61dfff"/></linearGradient>
    <filter id="blur65" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="65"/></filter>
    <filter id="blur20" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="19"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="microGrid" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M 58 0 L 0 0 0 58" fill="none" stroke="#88a2d5" stroke-width="1" opacity=".042"/></pattern>
    <pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#9cc0fa" opacity=".12"/></pattern>
    <clipPath id="canvas"><rect width="2400" height="980"/></clipPath>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="2400" height="980" fill="url(#backdrop)"/>
    <rect width="2400" height="980" fill="url(#microGrid)"/>
    <rect width="2400" height="980" fill="url(#dots)" opacity=".45"/>
    <ellipse cx="1860" cy="474" rx="600" ry="540" fill="url(#cyanAura)"/>
    <ellipse cx="2160" cy="225" rx="420" ry="400" fill="url(#violetAura)"/>
    <ellipse cx="1900" cy="466" rx="285" ry="280" fill="#4fa3ff" opacity=".11" filter="url(#blur65)"/>
    <ellipse cx="1858" cy="482" rx="370" ry="370" fill="none" stroke="#9b9efe" stroke-width="100" opacity=".11" filter="url(#blur65)"/>
    <g transform="translate(1830 465) rotate(-24)">
      <ellipse rx="344" ry="225" fill="none" stroke="#a3b7e9" stroke-width="1.5" opacity=".21"/>
      <ellipse rx="322" ry="206" fill="none" stroke="#a8d8e7" stroke-width="1.2" opacity=".13"/>
      <ellipse rx="299" ry="188" fill="none" stroke="#96b6f4" stroke-width="1.4" opacity=".10"/>
      <ellipse rx="273" ry="171" fill="none" stroke="#7495dd" stroke-width="1.4" opacity=".09"/>
      <path d="M -345 0 A 345 225 0 0 1 345 0" fill="none" stroke="url(#arcA)" stroke-width="23" stroke-linecap="round" filter="url(#blur20)" opacity=".85"/>
      <path d="M -345 0 A 345 225 0 0 1 345 0" fill="none" stroke="url(#arcA)" stroke-width="7" stroke-linecap="round" opacity=".95"/>
      <path d="M 345 0 A 345 225 0 0 1 -345 0" fill="none" stroke="url(#arcB)" stroke-width="18" stroke-linecap="round" filter="url(#blur20)" opacity=".58"/>
      <path d="M 345 0 A 345 225 0 0 1 -345 0" fill="none" stroke="url(#arcB)" stroke-width="5" stroke-linecap="round" opacity=".80"/>
      <path d="M -301 0 A 301 185 0 0 0 301 0" fill="none" stroke="#a7d9ff" stroke-width="2.5" opacity=".42"/>
      <path d="M -269 0 A 269 157 0 0 1 269 0" fill="none" stroke="#8ab9f3" stroke-width="1.5" opacity=".35"/>
      <path d="M -220 0 A 220 125 0 0 1 220 0" fill="none" stroke="#6b7eca" stroke-width="1" opacity=".19"/>
      <ellipse rx="126" ry="77" fill="none" stroke="#aed0ff" stroke-width="1.5" opacity=".10"/>
      <circle cx="-334" cy="-54" r="13" fill="#80e9ff" opacity=".29" filter="url(#blur20)"/>
      <circle cx="-334" cy="-54" r="5.5" fill="url(#nodeGlow)" filter="url(#glow)"/>
      <circle cx="337" cy="-48" r="10" fill="#cac3ff" opacity=".36" filter="url(#blur20)"/>
      <circle cx="337" cy="-48" r="4.5" fill="#ddd9ff"/>
      <circle cx="-35" cy="-225" r="5" fill="#b5fdff" filter="url(#glow)"/>
      <circle cx="165" cy="-164" r="3.4" fill="#c9d3ff"/>
    </g>
    <g opacity=".68">
      <path d="M 1530 740 L 1634 740" stroke="#7d9ac8" stroke-width="1" opacity=".36"/>
      <text x="1528" y="728" fill="#9cb2d5" font-family="Inter, Arial, sans-serif" font-size="19" letter-spacing="4.5">OBSERVE</text>
      <text x="2140" y="196" fill="#a3b8e1" font-family="Inter, Arial, sans-serif" font-size="19" letter-spacing="4">ADAPT</text>
      <circle cx="2099" cy="209" r="3" fill="#a9cff5"/>
      <path d="M 2103 209 L 2135 209" stroke="#90a8d2" stroke-width="1" opacity=".7"/>
      <text x="1910" y="472" fill="#c1cff2" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" letter-spacing="5.4" text-anchor="middle" opacity=".8">FEEDBACK</text>
      <text x="1910" y="500" fill="#809ac8" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="5" text-anchor="middle">IS THE ENGINE</text>
    </g>
    <rect x="146" y="101" width="54" height="54" rx="14" fill="#d7eaff" opacity=".09" stroke="#b4d5fa" stroke-opacity=".38" stroke-width="1.5"/>
    <path d="M 160 141 L 160 118 L 173 132 L 186 118 L 186 141" fill="none" stroke="#e9f4ff" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="224" y="134" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="3.5" fill="#f3f7ff">MOONHOTLINE</text>
    <text x="2225" y="130" text-anchor="end" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="21" letter-spacing="3.4" fill="#94a8ca">AI BUILDER <tspan fill="#506789">/</tspan> FOUNDER</text>
    <text x="138" y="352" font-family="Inter Display, Inter, Arial, sans-serif" font-size="144" font-weight="760" letter-spacing="-8" fill="#f3f7ff">BUILD.<tspan dx="30">SHIP.</tspan></text>
    <text x="138" y="514" font-family="Inter Display, Inter, Arial, sans-serif" font-size="139" font-weight="760" letter-spacing="-7" fill="url(#accent)">LEARN.<tspan dx="30">EVOLVE.</tspan></text>
    <text x="149" y="634" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="400" fill="#c3cee1">Agent-native products, built for the real world.</text>
    <text x="149" y="682" font-family="Inter, Arial, sans-serif" font-size="28" fill="#8b9cb8">From prototype to users. From product to growth.</text>
    <line x1="146" y1="783" x2="2255" y2="783" stroke="url(#hairline)" stroke-width="1.5"/>
    <text x="147" y="839" font-family="Inter, Arial, sans-serif" font-weight="650" font-size="22" letter-spacing="3.3" fill="#dce6f7">PRODUCT  /  SALES  /  OPERATIONS</text>
    <text x="2253" y="839" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="3" fill="#a9bff4">OODA <tspan fill="#62779d">+</tspan> RSI</text>
    <text x="146" y="918" font-family="Inter, Arial, sans-serif" font-weight="450" font-size="19" letter-spacing="2.4" fill="#778dae">AGENT REALITY API     /     NETHER COUNCIL     /     LAST LIGHT SPACE     /     RETRO HOTLINE</text>
    <text x="2253" y="918" text-anchor="end" font-family="Inter, Arial, sans-serif" font-weight="450" font-size="19" letter-spacing="2.2" fill="#6f85a8">BUILDING IN PUBLIC</text>
  </g>
</svg>